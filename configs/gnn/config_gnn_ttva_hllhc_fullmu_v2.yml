# ITk full-pileup GNN v2: the v1 recipe (config_gnn_ttva_hllhc_fullmu_v1.yml) on 2.5x
# more training events. Only the training set changes; architecture, loss, optimiser,
# learning rate, cosine schedule, batch size, dropout, kNN (k=20), truth-vertex candidates
# and the hllhc_alleta preset are identical to v1.
# Training: v1's 60,000 r16443 events (12 shards, unchanged) + 89,820 r16638 events
# (18 shards; r16638 is an independent production, no shared hard-scatter vertex or
# truth-z fingerprint with r16443). Total 149,820 events, 30 shards, v1 and r16638
# shards interleaved so each stretch of the round-robin mixes both files.
# Validation monitor, validation and reserved-test entries are v1's, unchanged, so v1
# and v2 compare directly. 10% of r16638 (9,980 events) is an extra reserved test.
# Schedule: 540 shard epochs = 18 full passes over 149,820 events, the same number of
# passes as v1 (whose best validation epoch was 213 of 216, still improving at the end
# of its cosine schedule, so no sign of overfitting). 2.70M event presentations, 2.5x v1.
# Physical GPU 2 is exposed as cuda:0 by the wrapper (run_gnn_fullmu_v2_20261111.sh).
