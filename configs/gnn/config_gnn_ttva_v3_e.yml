# GNN v3 campaign, control run e (docs/evaluation/gnn_v3_campaign_2026-11-13.md, section 9).
# Mattia's question: is truth-candidate training as good as s8-candidate training at the same network?
# Exactly run c (interaction network, hidden 64, 3 layers, softmax + no-vertex; 540 shard epochs, batch 32,
# cosine 1e-3 -> 1e-5, seed, same s8 validation monitor for checkpoint selection), but trained on v2's
# TRUTH-vertex graphs: the same 149,820 events in the same shard order (v2's 30 shards). Candidate features
# for truth vertices as v2 had them: z = truth z, height = recipe height (July height fix), sigma = preset
# sigma(nTracks) (hllhc_alleta), the sigma chain_inference_v3 gives truth candidates. Evaluated on s8.
