# GNN TTVA v4 (arm B: NO augmentation) - the control for arm A.
#
# Identical events, shard boundaries, seeds, architecture and schedule as
# config_gnn_ttva_hllhc_v4_aug.yml; the ONLY difference is that these truth
# graphs were built without chain-like augmentation. The pair measures how
# much augmentation is worth on the v6 chain, which has a much higher junk
# rate than the v4b chain the v3 augmentation was tuned on - so the v3
# result cannot simply be assumed to carry over.
#
# Usage (inside tmux):
#   python -u -m gnn.training.train_ttva -c configs/gnn/config_gnn_ttva_hllhc_v4_noaug.yml

# --- Data (sharded, one shard resident per epoch) ---
data_files:
  - "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_pristine/train_shard_0.pt"
  - "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_pristine/train_shard_1.pt"
  - "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_pristine/train_shard_2.pt"
