val_file: "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_pristine/val_shard.pt"
batch_size: 32
num_workers: 2

# --- Model architecture (unchanged since the mu60 baseline) ---
model_config:
  track_input_size: 8   # d0, z0, d0_err, z0_err, cov, theta, phi, pt_scaled
  pv_input_size: 2      # z_position, peak_height
  hidden_dim: 32
  num_heads: 4
  edge_attr_dim: 3      # long_sig, horiz_sig, |dz|
  dropout: 0.25

# --- Training ---
n_epochs: 324           # 18 passes x 18 shards
learning_rate: 0.001
lr_schedule:
  type: cosine
  eta_min: 0.00001
grad_clip: 1.0
device_id: 2

# --- Checkpointing ---
save_weights: true
save_frequency: 12
save_folder: "/data/home/matmauro/codice/PV-Finder/model_weights/ttva_gnn_hllhc_v4_aug/"

# --- MLflow ---
experimentname: "TTVA_GNN"
runname: "ttva_gat_alleta_k20_v4_aug180k"
