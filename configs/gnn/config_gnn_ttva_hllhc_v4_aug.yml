# GNN TTVA v4 (arm A: chain-like augmentation) - extended-|eta| July-2026
# re-production, sitting on top of PV-Finder v6.
#
# Changes vs v3:
#   - data is data/run4_all_etas (|eta| < 4), built with the hllhc_alleta
#     resolution preset. v3 used |eta| < 2.5 data and the 'hllhc' preset.
#   - 18 shards x 10k instead of 9 x 20k: the extended-|eta| events carry
#     ~1315 tracks (vs ~927), so a 20k shard no longer fits comfortably in
#     the 32 GB per-process limit. 324 epochs = 18 passes, the same number
#     of graph presentations as v3's 162 epochs over 20k shards.
#   - augmentation parameters re-measured on the v6 chain, not reused from
#     the v4b chain.
#
# Validation is the PRISTINE 5k val shard in BOTH arms, so this curve and
# the no-augmentation arm's curve are read against one common yardstick.
# Arm A therefore validates slightly out of its training distribution; the
# chain evaluation, not this loss, is what decides between the arms.
#
# Usage (inside tmux):
#   python -u -m gnn.training.train_ttva -c configs/gnn/config_gnn_ttva_hllhc_v4_aug.yml

# --- Data (sharded, one shard resident per epoch) ---
data_files:
  - "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_augmented/train_shard_0.pt"
  - "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_augmented/train_shard_1.pt"
  - "/data/home/matmauro/codice/PV-Finder/data/run4_all_etas/ttva_graphs/v4_shards_augmented/train_shard_2.pt"
