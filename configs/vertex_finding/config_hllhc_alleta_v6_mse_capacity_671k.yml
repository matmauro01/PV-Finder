# Controlled capacity comparison with the v6 production model.
# This keeps the current v2 architecture and the complete v6 training recipe,
# but scales the model to the capacity of the historical 681k model. One latent
# channel and 112 U-Net channels give nearly the same parameter allocation:
# 196,072 track-MLP + 475,329 U-Net = 671,401 total trainable parameters.
# Production v6 has 3,547,993 parameters (583,072 + 2,964,921).
