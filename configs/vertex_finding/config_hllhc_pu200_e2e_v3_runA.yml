# Run A: Aggressive LR + cosine warm restarts
#
# Hypothesis: v3 under-learned because LR was too conservative.
# LR=2e-4 (2x v2's 1e-4) with warm restarts every 50 epochs
# to periodically re-inject exploration.

data_file: /data/home/matmauro/codice/PV-Finder/data/run4/hllhc_pu200_training.h5
output_file_path: /data/home/matmauro/codice/PV-Finder/outputs/

device_id: 0
n_events: 99800
train_split: [0.7, 0.25, 0.05]
batch_size: 128
num_workers: 16
max_grad_norm: 1.0

phase1_epochs: 50
phase1_learning_rate: 0.001

phase2_epochs: 200
phase2_learning_rate: 0.0002
phase2_warmup_epochs: 0
phase2_cosine_eta_min_frac: 0.01
warm_restarts_t0: 50

use_mse_loss: true
asymmetry_param: 2.5

save_weights: true
save_frequency: 10
save_folder: /data/home/matmauro/codice/PV-Finder/model_weights/
log_folder: /data/home/matmauro/codice/PV-Finder/outputs/logs/

experimentname: "HLLHC PU200 — v3 training sweep"
runname: "v3_runA_lr2e4_warmrestart50"

models_config:
  model_type: "v2"
  n_input_features: 7
  n_latent_channels: 4
  dropout: 0.25
  n_unet_channels: 280
  l_hidden_nodes: [128, 128, 128, 128, 128]
