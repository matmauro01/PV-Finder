# Run C: MSE + TV regularization
#
# Hypothesis: MSE loss landscape is flat — the larger model has no
# gradient signal to push past the v2 solution. TV regularization
# penalizes high-frequency oscillations (sidelobes), creating a
# deeper minimum that rewards the larger model's capacity.
# LR=1e-4 (same as v2), Adam, standard cosine.

data_file: /data/home/matmauro/codice/PV-Finder/data/run4/hllhc_pu200_training.h5
output_file_path: /data/home/matmauro/codice/PV-Finder/outputs/

device_id: 2
n_events: 99800
train_split: [0.7, 0.25, 0.05]
batch_size: 128
num_workers: 16
max_grad_norm: 1.0

tv_lambda: 0.1

phase1_epochs: 50
phase1_learning_rate: 0.001

phase2_epochs: 200
phase2_learning_rate: 0.0001
phase2_warmup_epochs: 5
phase2_cosine_eta_min_frac: 0.01

use_mse_loss: true
asymmetry_param: 2.5

save_weights: true
save_frequency: 10
save_folder: /data/home/matmauro/codice/PV-Finder/model_weights/
log_folder: /data/home/matmauro/codice/PV-Finder/outputs/logs/

experimentname: "HLLHC PU200 — v3 training sweep"
runname: "v3_runC_mse_tv01"

models_config:
  model_type: "v2"
  n_input_features: 7
  n_latent_channels: 4
  dropout: 0.25
  n_unet_channels: 280
  l_hidden_nodes: [128, 128, 128, 128, 128]
